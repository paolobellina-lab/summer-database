<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summer Database 2027</title>
<meta name="theme-color" content="#f5eee0">
<!-- "only light": impedisce ai browser Android (Samsung Internet, Chrome con tema scuro forzato) di scurire da soli il tema chiaro -->
<meta name="color-scheme" content="only light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://esmeraldaluxuryvillas.com https://www.esmeraldaluxuryvillas.com; connect-src 'self' https://esmeraldaluxuryvillas.com https://www.esmeraldaluxuryvillas.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Summer DB">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="icons/esmeralda-favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/esmeralda-icon-192.png">
<link rel="apple-touch-icon" href="icons/esmeralda-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script>try { var t = (JSON.parse(localStorage.getItem('summer-db-2027-ui') || '{}').theme) || 'light'; if (t !== 'auto') document.documentElement.setAttribute('data-theme', t); var cs = document.querySelector('meta[name="color-scheme"]'); if (cs) cs.setAttribute('content', t === 'dark' ? 'only dark' : t === 'auto' ? 'light dark' : 'only light'); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }</script>
<script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__sdbInstall = e; });</script>
<script src="core.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- seed.js esiste solo sul tuo computer (dati Excel per la modalità locale): non viene caricato su GitHub -->
<script src="seed.js"></script>
<script src="store.js"></script>
<script src="export.js"></script>
<script src="spese.js"></script>
<script src="offerte.js"></script>
<script src="importa-sito.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
